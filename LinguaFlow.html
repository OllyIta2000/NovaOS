 return `<h1>Progress</h1><div class="grid">${st('Words studied',A.filter(seenC).length)}${st('Words mastered',mast)}${st('Total answers',tot)}${st('Best streak',(S.best||0)+' days')}</div>
<h3>Accuracy by mode</h3><div class="grid">${Object.keys(M).map(k=>{const m=S.modes[k];return st(M[k],m&&m.n?Math.round(m.ok/m.n*100)+'%':'No data yet')}).join('')}</div>
<h3>Last 28 days</h3><div class="cal">${cal}</div><p class="mu">Dark squares mean you reached your daily goal. Missing a day is fine.</p>
<h3>Achievements</h3><div class="grid">${ach.map(a=>`<div class="card" style="${a[2]?'':'opacity:.5'}"><b>${a[2]?'Earned: ':''}${a[0]}</b><p class="mu">${a[1]}</p></div>`).join('')}</div>`}
function set(){return `<h1>Settings</h1><div class="card"><label>I speak</label>${sel('nat',LANGS,S.nat)}<label>I’m learning</label>${sel('tgt',LANGS,S.tgt)}<label>Level</label>${sel('lvl',LV,S.lvl)}<label>Daily goal (answers)</label><input id="goal" type="number" min="1" max="200" value="${S.goal}"><label>Theme</label>${sel('theme',{auto:'Match my device',light:'Light',dark:'Dark'},S.theme)}</div>
<h3>Profile</h3><div class="card"><p class="mu">Signed in as <b>${esc((P.find(p=>p.id===cur)||{}).name)}</b>. Progress is saved separately for each profile in this browser.</p><div class="row"><button class="btn" data-a="signout">Sign out</button></div></div><h3>Your data</h3><div class="card"><p class="mu">Everything is stored in this browser. Export a backup, or paste one to restore it.</p><div class="row"><button class="btn" data-a="xp">Export progress</button></div>${E.x?`<textarea readonly rows="5" style="width:100%" onfocus="this.select()">${esc(E.x)}</textarea><p class="mu">Copy this text and keep it as a .json file.</p>`:''}
<label>Import</label><textarea id="imp" rows="3" style="width:100%" placeholder="Paste exported JSON here"></textarea><div class="row"><input type="file" id="imf" accept=".json,application/json"><button class="btn" data-a="imp">Import</button></div>${E.im?`<p class="${E.imok?'':'no'}">${E.im}</p>`:''}
<div class="row"><button class="btn no" data-a="reset">${CF==='r'?'Click again to erase everything':'Reset all data'}</button></div></div>`}
function deckCard(d,i=0){const n=d.c.filter(isLearned).length,len=d.c.length,seen=d.c.some(seenC),done=len&&n===len,s=Math.round(len*7.5);
 const cl=done||seen?'':['p','o','b'][i%3],bd=done?'✓ Completed':seen?Math.round(n/len*100)+'% learned':'🔥 New';
 return `<div class="dk ${cl}" data-a="study" data-id="${d.id}"><b>${esc(d.name)}</b><span class="bdg">${bd}</span><button class="pl" data-a="pdeck" data-id="${d.id}">Practice</button><div class="ft"><span>☐ ${len} Cards</span><span>⏱ ${Math.floor(s/60)}min ${s%60}sec</span></div></div>`}
function exp(){const b=built(),A=b.flatMap(d=>d.c),n=A.filter(isLearned).length,L=LANGS[S.tgt];
 return `<div class="ex"><aside><div class="art"><svg viewBox="0 0 200 200" width="100%" role="img" aria-label="Book"><rect width="200" height="200" fill="#f9bf4a"/><g transform="rotate(-12 100 110)"><rect x="40" y="60" width="120" height="90" rx="6" fill="#3560b8"/><rect x="52" y="52" width="100" height="90" rx="4" fill="#fff"/><rect x="60" y="62" width="84" height="8" fill="#ee6a3e"/><text x="102" y="108" text-anchor="middle" font-size="14" font-weight="800" fill="#1d2d5a">${esc(L.toUpperCase())}</text></g><circle cx="48" cy="48" r="12" fill="#ee6a3e"/><circle cx="160" cy="44" r="9" fill="#2684ff"/></svg></div>
<div class="row"><button class="btn pri" data-a="studyall">Study all</button><button class="btn" data-a="go" data-v="prac">Practice</button></div>
<h2>${L} Vocabulary for Beginners</h2><p class="mu">${b.length?'Start your journey into '+L+' with this beginner-friendly collection of vocabulary decks.':'Create your own decks to start learning '+L+'.'}</p>
<div class="row"><span class="tag">Category: Languages</span><span class="tag">${n} of ${A.length} learned</span></div>${note()}</aside>
<div class="grid">${b.map(deckCard).join('')}<div class="dk add" data-a="go" data-v="my"><span style="font-size:28px">+</span>Add New Deck</div></div></div>`}
const rvq=()=>!!(Q.rv&&Q.rv[Q.i]),qs=c=>rvq()?c.t:c.w,ans=c=>rvq()?c.w:c.t;
function fb(c){const ok=Q.res[c.id]==='k';return `<div class="card ${ok?'good':'bad'}">${ok?'Correct!':'Answer: <b>'+esc(ans(c))+'</b>'}${c.ex?`<br><span class="mu">${esc(c.ex)} (${esc(c.exT)})</span>`:''}<div class="row"><button class="btn pri" data-a="nxt">Continue</button></div></div>`}
function mcV(c){const q=Q,A=ans(c);if(!q.o){const rv=rvq(),seen=new Set([A]),d=[];for(const x of shuffle(all())){const v=rv?x.w:x.t;if(!seen.has(v)){seen.add(v);d.push(v)}if(d.length>=3)break}q.o=shuffle([A,...d])}
 return `<div class="card" style="text-align:center"><div class="mu">Choose the translation</div><h2>${esc(qs(c))}</h2>${rvq()?'':`<small>${esc(c.pr)}</small>`}</div><div class="opts">${q.o.map((o,i)=>`<button class="btn opt ${q.a!=null?(o===A?'good':o===q.a?'bad':''):''}" data-a="pick" data-i="${i}" ${q.a!=null?'disabled':''}>${esc(o)}</button>`).join('')}</div>${q.a!=null?fb(c):''}`}
function typeV(c){const q=Q;return `<div class="card" style="text-align:center"><div class="mu">Type the translation</div><h2>${esc(qs(c))}</h2>${rvq()?'':`<small>${esc(c.pr)}</small>`}</div><div class="row c"><input id="ans" autocomplete="off" placeholder="Your answer" ${q.a!=null?'disabled value="'+esc(q.a)+'"':''}>${q.a==null?'<button class="btn pri" data-a="check">Check</button>':''}</div>${q.a!=null?fb(c):''}`}
const VIEWS={dash,my,exp,prac,lib,prog,set,ses};
function adv(){Q.i++;Q.fl=0;Q.a=null;Q.o=null}
document.addEventListener('click',e=>{const a=e.target.closest('[data-a]');if(!a||a.disabled)return;const d=a.dataset,x=d.a,keep=CF;CF='';const q=Q;
 const cf=k=>{if(keep===k)return true;CF=k;render();return false};
 if(x==='flip'){q.fl=q.fl?0:1;const f=$('.fc');if(f)f.classList.toggle('fl');return}
 if(x==='go'){V=d.v;E={};if(V!=='ses')Q=Q&&V==='ses'?Q:null}
 else if(x==='start'){if(val('nat')===val('tgt')){E.err='Choose two different languages.'}else{S.setup=1;E={};save()}}
 else if(x==='cont'){let p=all().filter(isDue);let id;if(!p.length){const dk=decks().find(k=>k.id===S.rec[0])||decks()[0];p=dk?dk.c:[];id=dk&&dk.id}return start('flash',p,'Daily review',id)}
 else if(x==='study'){const dk=decks().find(k=>k.id===d.id);return start('flash',dk.c,dk.name,dk.id)}
 else if(x==='studyall'){return start('flash',built().flatMap(k=>k.c),'All decks')}
 else if(x==='pdeck'){PS.d=d.id;V='prac';Q=null}
 else if(x==='pm'){const k=PS.d,dk=decks().find(z=>z.id===k);return start(d.m,pool(k),dk?dk.name:k==='mix'?'All words, mixed':'Difficult and due words',dk&&dk.id)}
 else if(x==='prev'){q.i=Math.max(0,q.i-1);q.fl=0}
 else if(x==='next'){adv()}
 else if(x==='shuf'){shuffle(q.c);q.i=0;q.fl=0}
 else if(x==='restart'){if(q.m==='match'){shuffle(q.c);initMatch()}else{q.i=0;q.fl=0;q.res={};q.a=null;q.o=null;q.fin=0}}
 else if(x==='rate'){const c=q.c[q.i];if(d.r==='l'){grade(c,true,'flash');const r=S.rev[c.id];r.lrn=1;r.box=5;r.due=Date.now()+16*DAY;save()}else grade(c,d.r==='k','flash',d.r==='h');q.res[c.id]=d.r;adv()}
 else if(x==='pick'){const c=q.c[q.i],o=q.o[+d.i];q.a=o;grade(c,o===ans(c),'mc');q.res[c.id]=o===ans(c)?'k':'h'}
 else if(x==='check'){doCheck()}
 else if(x==='nxt'){adv()}
 else if(x==='exit'){Q=null;V='prac'}
 else if(x==='ml'){q.sel=+d.id||d.id;q.w=[]}
 else if(x==='mr'){if(q.sel==null)return;const id=d.id,s=q.sel;if(s===id){q.d.push(id);if(!q.bad[id]){q.res[id]='k';grade(cardOf(id),true,'match')}else q.res[id]='h';if(q.d.length===q.L.length){q.o+=6;if(q.o<q.c.length)mround()}}else{q.bad[s]=1;if(!q.res[s]){q.res[s]='h';grade(cardOf(s),false,'match')}q.w=[id]}q.sel=null}
 else if(x==='adddeck'){const n=val('dn').trim();if(!n)E.err='Give the deck a name.';else if(S.cus.some(k=>k.name.toLowerCase()===n.toLowerCase()))E.err='You already have a deck with that name.';else{const id='u'+Date.now().toString(36);S.cus.push({id,name:n,topic:val('dt').trim(),c:[]});E={ed:id};save()}}
 else if(x==='deldeck'){if(!cf('d'+d.id))return;const k=S.cus.find(z=>z.id===d.id);k.c.forEach(c=>delete S.rev[c.id]);S.cus=S.cus.filter(z=>z.id!==d.id);S.rec=S.rec.filter(z=>z!==d.id);if(E.ed===d.id)E={};save()}
 else if(x==='edit'){E={ed:d.id}}
 else if(x==='closeEd'){E={}}
 else if(x==='savecard'){const k=S.cus.find(z=>z.id===E.ed),w=val('cw').trim(),t=val('ct').trim();
  if(!w||!t)E.err='Enter both a word and its translation.';
  else if(k.c.some((c,i)=>i!==E.ec&&c.w.toLowerCase()===w.toLowerCase()))E.err='That word is already in this deck.';
  else{const o={w,t,ex:val('cx').trim(),exT:val('cy').trim()};if(E.ec!=null)Object.assign(k.c[E.ec],o);else k.c.push({id:'k'+Date.now().toString(36)+Math.floor(Math.random()*1e4),...o});E.ec=null;E.err='';save()}}
 else if(x==='editcard'){E.ec=+d.i;E.err=''}
 else if(x==='delcard'){if(!cf('c'+d.i))return;const k=S.cus.find(z=>z.id===E.ed),c=k.c[+d.i];delete S.rev[c.id];k.c.splice(+d.i,1);E.ec=null;save()}
 else if(x==='signin'){const p=P.find(z=>z.id===d.id);if(p.pin){E={pid:p.id}}else return enter(p.id)}
 else if(x==='pinok'){const p=P.find(z=>z.id===E.pid);hash(val('lpin')).then(h=>{if(h===p.pin)enter(p.id);else{E.lm='Wrong PIN.';render()}});return}
 else if(x==='mkprof'){const n=val('ln').trim(),pn=val('lp').trim();
  if(!n)E.lm='Enter a name.';else if(P.some(z=>z.name.toLowerCase()===n.toLowerCase()))E.lm='That name is already used.';else if(pn&&!/^\d{4,12}$/.test(pn))E.lm='The PIN must be 4 to 12 digits.';
  else{hash(pn).then(h=>{const id='p'+Date.now().toString(36);P.push({id,name:n,pin:pn?h:''});savP();enter(id)});return}}
 else if(x==='signout'){cur=null;try{localStorage.removeItem('lf_c')}catch(e){}E={};Q=null;V='dash'}
 else if(x==='xp'){E.x=JSON.stringify(S)}
 else if(x==='imp'){try{const o=JSON.parse(val('imp'));if(!o||typeof o!=='object'||!o.rev||!Array.isArray(o.cus))throw 0;S={...def(),...o,setup:1};save();E={im:'Progress imported.',imok:1}}catch(err){E={im:'That is not a valid LinguaFlow export.'}}}
 else if(x==='reset'){if(!cf('r'))return;S=def();save();V='dash';Q=null;E={}}
 render()});
const savP=()=>{try{localStorage.setItem('lf_p',JSON.stringify(P))}catch(e){}};
const hash=async s=>{try{return [...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode('lf:'+s)))].map(b=>b.toString(16).padStart(2,'0')).join('')}catch(e){return 'x:'+s}};
function enter(id){cur=id;try{localStorage.setItem('lf_c',id)}catch(e){}load(id);E={};V='dash';Q=null;render()}
function login(){return `<div class="card" style="max-width:440px;margin:7vh auto"><h1>LinguaFlow</h1>${P.length?`<p class="mu">Choose a profile to continue.</p>${P.map(p=>`<div class="li"><b>${esc(p.name)}${p.pin?' 🔒':''}</b><button class="btn pri" data-a="signin" data-id="${p.id}">Sign in</button></div>`).join('')}${E.pid?`<div class="row"><input id="lpin" type="password" inputmode="numeric" placeholder="PIN" autocomplete="off"><button class="btn pri" data-a="pinok">Unlock</button></div>`:''}`:'<p class="mu">Create a profile to save your progress on this device.</p>'}${E.lm?`<p class="no">${E.lm}</p>`:''}<h3>New profile</h3><div class="row"><input id="ln" placeholder="Name" maxlength="24"><input id="lp" type="password" inputmode="numeric" placeholder="PIN (optional)" maxlength="12"><button class="btn" data-a="mkprof">Create</button></div><p class="mu">Profiles are stored in this browser only. A PIN keeps other people on this device out, but it is not a secure online account.</p></div>`}
function doCheck(){const q=Q,c=q.c[q.i],v=val('ans').trim();if(!v)return;q.a=v;const rv=rvq(),ok=same(v,ans(c))||(rv?(c.pr?same(v,c.pr):false):(c.tp?same(v,c.tp):false));grade(c,ok,'type');q.res[c.id]=ok?'k':'h';render()}
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='gs'){F={q:e.target.value,c:'',l:'',s:''};V='lib';Q=null;E={};return render()}if(e.key!=='Enter'||V!=='ses'||!Q)return;if(Q.m==='type'&&Q.a==null)doCheck();else if(Q.a!=null&&Q.m!=='flash'&&Q.m!=='match'){e.preventDefault();adv();render()}});
document.addEventListener('input',e=>{if(e.target.id==='fq'){F.q=e.target.value;$('#lr').innerHTML=libList()}});
document.addEventListener('change',e=>{const t=e.target,id=t.id;
 if(id==='pn'){PS.n=+t.value;return}if(id==='pr'){PS.r=t.value;return}if(id==='pd'){PS.d=t.value;return}
 if(['fc','fl','fs'].includes(id)){F[id==='fc'?'c':id==='fl'?'l':'s']=t.value;$('#lr').innerHTML=libList();return}
 if(['nat','tgt','lvl','theme'].includes(id)){S[id]=t.value;save();if(S.setup)render();else document.documentElement.dataset.theme=''}
 if(id==='goal'){S.goal=Math.max(1,Math.min(200,parseInt(t.value)||10));save();render()}
 if(id==='imf'&&t.files[0]){const r=new FileReader();r.onload=()=>{$('#imp').value=r.result};r.readAsText(t.files[0])}});
render();
</script></body></html>
